[package]
name = "opensearch-macro"
version = { workspace = true }
edition = { workspace = true }
description = { workspace = true }
authors = { workspace = true }
documentation = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
publish = true

[lib]
proc-macro = true

[dependencies]
darling = { workspace = true }
heck = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
# Path-only (no version) on purpose: this is a cyclic dev-dependency within the
# workspace. A version requirement would force registry resolution during
# `cargo publish` before opensearch-client is published. Cargo strips
# version-less dev-dependencies from the packaged manifest, breaking the cycle.
opensearch-client = { path = "../opensearch-client" }
serde = { workspace = true, features = ["derive", "std"] }
