[workspace]
members = [
    "opensearch-cli",
    "opensearch-client",
    "opensearch-dsl",
    "opensearch-macro",
    "opensearch-testcontainer",
]
resolver = "2"

[workspace.package]
description = "OpenSearch Client"
version = "0.3.3"
edition = "2024"
authors = ["Alberto Paro"]
documentation = "https://docs.rs/opensearch-client/0.3.3/opensearch_client/"
license = "Apache-2.0"
repository = "https://github.com/aparo/opensearch-client-rs"
keywords = ["opensearch"]
readme = "README.md"

[workspace.dependencies]
# Internal crates
opensearch-client = { path = "./opensearch-client/", version = "0.3.3" }
opensearch-dsl = { path = "./opensearch-dsl/", version = "0.3.3" }
opensearch-macro = { path = "./opensearch-macro/", version = "0.3.3" }
opensearch-testcontainer = { path = "./opensearch-testcontainer/", version = "0.3.3" }

# External crates
anyhow = "1"
async-compression = "0.4.48"
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
base64 = "0.23.1"
bon = "3.10.1"
chrono = { version = "0.4.45", default-features = false }
clap = "4.6.7"
darling = "0.24.1"
dotenvy = "0.15.7"
futures = "0.3.34"
heck = "0.5.0"
http = "1.5.0"
loco-rs = { version = "1.2.0", default-features = false }
num-traits = "0.2.19"
pretty_assertions = "1.4.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
reqwest = "0.13.5"
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
reqwest-tracing = "0.7.1"
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.151"
serde_repr = "0.1.21"
serde_with = { version = "3.23.0", default-features = false }
syn = "3.0.6"
testcontainers = "0.28.0"
thiserror = "2.0.21"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-test = "0.2.6"
url = "2.5.8"
walkdir = "2.5.0"

[workspace.metadata.precommit]
fmt = "cargo fmt"
sort = "cargo sort -w"
